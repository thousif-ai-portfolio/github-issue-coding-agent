name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Lets the sandbox tests run for real: network blocked, changes applied in a container.
      - name: Build the test sandbox image
        run: docker build -t issue-agent-sandbox sandbox
      # Uses a fake model, so no Ollama is needed. Also checks every planted bug is real.
      - run: pytest

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Type-checks (tsc -b) and builds.
      - run: npm run build
