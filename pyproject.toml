[project]
name = "github-issue-coding-agent"
version = "0.1.0"
description = "An AI agent that reads a GitHub issue, finds the code involved and proposes a fix."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "shopkit"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends"]
